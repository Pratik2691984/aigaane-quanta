name: Aigaane-Quanta CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: aigaane-engine-2026

      - name: Fetch canon.db from GCS if missing
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ ! -f backend/data/canon.db ] && [ -n "$GCP_SA_KEY" ]; then
            KEY_FILE="$(mktemp)"
            printf '%s' "$GCP_SA_KEY" > "$KEY_FILE"
            gcloud auth activate-service-account --key-file="$KEY_FILE" --quiet
            rm -f "$KEY_FILE"
            mkdir -p backend/data
            gcloud storage cp gs://aigaane-kosha-storage-2026/canon/canon.db backend/data/canon.db --project=aigaane-engine-2026
          fi

      - name: Run Pytest Suite
        run: |
          pytest backend/tests/ -v